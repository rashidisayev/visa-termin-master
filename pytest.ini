[pytest]
# pytest configuration for visa-termin test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=lib
    --cov-report=html
    --cov-report=term-missing
    --disable-warnings

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions and classes
    integration: Integration tests combining multiple modules
    slow: Tests that take longer to run
    config: Tests for configuration module
    visa_types: Tests for visa type management
    portal_detection: Tests for portal type detection
    extraction: Tests for HTML extraction
    utils: Tests for utility functions
    requires_network: Tests that require network access

# Coverage settings
[coverage:run]
source = lib
omit =
    */tests/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
